{
  -- Insanite factory plant config: EVERY device the plugin talks to, by peripheral name.
  -- Lives at /insanite.conf on the controller computer. The plugin refuses to start unless
  -- every device below is defined; use false for "none" (e.g. an outlet that pipes already
  -- empty). Names are what chat shows when you right-click a wired modem, or what the
  -- `peripherals` command lists.
  --
  -- Only devices are required here. Any tuning value from src/plugins/insanite/config.lua
  -- (stockBlocks, rodTau, slowAlertPct, ...) can also be overridden in this file.

  -- ME Bridge, by its wired-network name (not "bottom").
  bridge = "me_bridge_2",

  -- Monitor dedicated to the factory status screen; the core UI stops drawing on it.
  -- false = no status monitor.
  monitor = "monitor_3",

  -- Reactor whose burn pace the "dev" column compares the others against.
  referenceReactor = "BigReactors-Reactor_6",

  machines = {
    -- One Reprocessor: its Waste Injector (items) and Fluid Injector (fluids).
    reprocessor = {
      ports = {
        solid = "bigreactors:reprocessorwasteinjector_0",
        fluid = "bigreactors:reprocessorfluidinjector_0",
      },
      -- Reprocessor Output Port for the plugin to empty into ME; false = piped/bused already.
      output = false,
    },
    -- One solid-mixing Fluidizer (two Solid Injectors): 2 yellorium (a) + 1 blutonium (b).
    fluidizer = {
      ports = {
        a = "bigreactors:fluidizersolidinjector_0",
        b = "bigreactors:fluidizersolidinjector_1",
      },
      -- Fluidizer Output Port for the plugin to empty into ME; false = piped/bused already.
      output = false,
    },
  },

  -- Every reactor in the factory, by computer-port name.
  --   fuel / waste: what it burns and what its OUTLET gives (a Solid Access Port gives ingots,
  --                 e.g. "cyanite"; a Fuel Injection Port gives fluid, e.g. "cyanite_fluid").
  --   rodControl:   "ratio" = part of the locked plant rate; "power" = core energy-demand control.
  --   inlet:        inlet-mode port the plugin feeds fuel into (false = not connected yet, no feeding).
  --   outlet:       outlet port the plugin empties into ME (false = piped/bused already).
  reactors = {
    ["BigReactors-Reactor_6"] = {
      fuel = "yellorium", waste = "cyanite", rodControl = "ratio",
      inlet = false, outlet = false,
    },
    ["BigReactors-Reactor_8"] = {
      fuel = "yellorium", waste = "cyanite_fluid", rodControl = "ratio",
      inlet = false, outlet = false,
    },
    ["BigReactors-Reactor_5"] = {
      fuel = "blutonium", waste = "magentite_fluid", rodControl = "ratio",
      inlet = false, outlet = false,
    },
    ["BigReactors-Reactor_7"] = {
      fuel = "verderium", waste = "rossinite", rodControl = "ratio",
      inlet = false, outlet = false,
    },
  },
}
