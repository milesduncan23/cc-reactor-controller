{
  -- Insanite factory plant config: EVERY device the plugin talks to, by peripheral name.
  -- Lives at /insanite.conf on the controller computer. The plugin refuses to start unless
  -- every device below is defined; use false for "none" (e.g. an outlet that pipes already
  -- empty). Names are what chat shows when you right-click a wired modem, or what the
  -- `peripherals` command lists.
  --
  -- Only devices are required here. Any tuning value from src/plugins/insanite/config.lua
  -- (stockBlocks, rodTau, slowAlertPct, ...) can also be overridden in this file.

  -- ME Bridge, by its wired-network name (not "bottom").
  bridge = "me_bridge_2",

  -- Monitor dedicated to the factory status screen; the core UI stops drawing on it.
  -- false = no status monitor.
  monitor = "monitor_4",

  -- Reactor whose burn pace the "dev" column compares the others against (a "ratio" reactor).
  referenceReactor = "BigReactors-Reactor_5",

  machines = {
    -- One Reprocessor: its Waste Injector (items) and Fluid Injector (fluids).
    reprocessor = {
      ports = {
        solid = "bigreactors:reprocessorwasteinjector_0",
        fluid = "bigreactors:reprocessorfluidinjector_0",
      },
      -- Reprocessor Output Port for the plugin to empty into ME; false = piped/bused already.
      output = false,
    },
    -- One solid-mixing Fluidizer (two Solid Injectors): 2 uranium (a) + 1 blutonium (b) -> verderium.
    fluidizer = {
      ports = {
        a = "bigreactors:fluidizersolidinjector_0",
        b = "bigreactors:fluidizersolidinjector_1",
      },
      -- Fluidizer Output Port for the plugin to empty into ME; false = piped/bused already.
      output = false,
    },
  },

  -- Every reactor in the factory, by computer-port name. Fuel is NOT the plugin's job: your own
  -- ME importer refuels the reactors; the plugin only sets their burn rates.
  --   fuel / waste: what it burns and what its OUTLET gives (a Solid Access Port gives ingots,
  --                 e.g. "cyanite"; a Fuel Injection Port gives fluid, e.g. "cyanite_fluid").
  --                 Reactors with the same waste share it (R6 + R8 both make cyanite).
  --   rodControl:   "ratio" = part of the locked plant rate (burns exactly its recipe share);
  --                 "stock" = outside the lock: burns flat out until ME holds stockCaps of its
  --                           waste, then stops until ME drops 10% below the cap;
  --                 "power" = core energy-demand control.
  --   outlet:       outlet port the plugin empties into ME (false = piped/bused already).
  reactors = {
    ["BigReactors-Reactor_6"] = {
      fuel = "uranium", waste = "cyanite", rodControl = "stock",
      outlet = false,
    },
    ["BigReactors-Reactor_8"] = {
      fuel = "uranium", waste = "cyanite", rodControl = "stock",
      outlet = false,
    },
    ["BigReactors-Reactor_5"] = {
      fuel = "blutonium", waste = "magentite", rodControl = "ratio",
      outlet = false,
    },
    ["BigReactors-Reactor_7"] = {  -- liquid in, liquid out (Fuel Injection Ports)
      fuel = "verderium", waste = "rossinite", rodControl = "ratio",
      outlet = false,
    },
  },

  -- "stock" reactors fill ME with their waste up to this amount (ingots for items, mB for
  -- fluids), for energy and spare cyanite.
  stockCaps = {
    cyanite = 4096,
  },
  -- Stock reactors stop while ME holds fewer of their fuel ingots than this (R6 + R8: uranium),
  -- and resume 5% above it.
  stockFuelFloor = {
    cyanite = 200000,
  },
  -- Optional burn ceiling for a stock pool, in mB/t for all its reactors together:
  -- stockMaxBurn = { cyanite = 20 },

  -- AE2 crafts the plugin may request. Only these three exist; each needs a matching pattern
  -- in AE2 (true = may request, false = never).
  autocraft = {
    cyanite_fluid = true,    -- liquid cyanite from cyanite ingots (1 ingot -> 1000 mB), below target
    magentite_fluid = true,  -- liquid magentite from magentite ingots (1 ingot -> 1000 mB), below target
    insanite_block = true,   -- Insanite Blocks once ME holds the full kit target (patterns for the
                             -- Insanite Block and the Inanite Block)
  },
}
